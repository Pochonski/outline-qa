# Ambiente aislado para las pruebas: base de datos, Redis y Outline propios,
# en puertos distintos a los de cualquier otra instalación de Outline.
#   docker compose up -d
# Nota: este archivo no se probó con Docker. La versión de Outline con la que se
# verificaron las pruebas se levantó desde el código fuente (ver README).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: outline
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: outline
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outline"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6390:6379"

  outline:
    image: outlinewiki/outline:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3010:3010"
    environment:
      NODE_ENV: production
      URL: http://localhost:3010
      PORT: 3010
      DATABASE_URL: postgres://outline:pass@postgres:5432/outline
      PGSSLMODE: disable
      REDIS_URL: redis://redis:6379
      SECRET_KEY: a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90
      UTILS_SECRET: aislado-utils-secret-0123456789
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      FORCE_HTTPS: "false"
      RATE_LIMITER_ENABLED: "false"
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_FROM_EMAIL: hello@example.com
    # La imagen no incluye yarn; el servidor aplica las migraciones pendientes al arrancar.
    command: ["node", "build/server/index.js", "--services=web,worker"]
